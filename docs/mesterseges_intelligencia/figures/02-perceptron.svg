<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 375" width="980" height="375" font-family="Inter,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker></defs>
<rect width="980" height="375" fill="#fcfcfb"/>
<text x="40" y="40" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600" >One artificial neuron (the perceptron)</text>
<circle cx="150" cy="95" r="18" fill="#ffffff" stroke="#b9b8b2" stroke-width="1.5"/>
<text x="122" y="100" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >pixel 1</text>
<line x1="172" y1="95" x2="402" y2="171.0" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="116.4" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >× weight 1</text>
<circle cx="150" cy="150" r="18" fill="#ffffff" stroke="#b9b8b2" stroke-width="1.5"/>
<text x="122" y="155" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >pixel 2</text>
<line x1="172" y1="150" x2="402" y2="182.0" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="153.8" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >× weight 2</text>
<circle cx="150" cy="205" r="18" fill="#ffffff" stroke="#b9b8b2" stroke-width="1.5"/>
<text x="122" y="210" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >pixel 3</text>
<line x1="172" y1="205" x2="402" y2="193.0" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="191.2" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >× weight 3</text>
<circle cx="150" cy="290" r="18" fill="#ffffff" stroke="#b9b8b2" stroke-width="1.5"/>
<text x="122" y="295" font-size="13" fill="#52514e" text-anchor="end" font-weight="400" >pixel 400</text>
<line x1="172" y1="290" x2="402" y2="210.0" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
<text x="270" y="249.0" font-size="13" fill="#52514e" text-anchor="middle" font-weight="400" >× weight 400</text>
<text x="150" y="254" font-size="20" fill="#8a8984" text-anchor="middle" font-weight="400" >⋮</text>
<circle cx="450" cy="190" r="46" fill="#e3eefb" stroke="#2a78d6" stroke-width="1.5"/>
<text x="450" y="186" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600" >add it</text>
<text x="450" y="205" font-size="15" fill="#0b0b0b" text-anchor="middle" font-weight="600" >all up</text>
<line x1="498" y1="190" x2="566" y2="190" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
<rect x="570" y="155" width="150" height="70" rx="10" fill="#fde9df" stroke="#eb6834" stroke-width="1.5"/>
<text x="645" y="185" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="400" >above the</text>
<text x="645" y="204" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600" >threshold?</text>
<line x1="724" y1="175" x2="786" y2="140" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
<line x1="724" y1="205" x2="786" y2="240" stroke="#52514e" stroke-width="2" marker-end="url(#a)"/>
<text x="795" y="138" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600" >yes → fire (1)</text>
<text x="795" y="246" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="400" >no → stay silent (0)</text>
<text x="40" y="350" font-size="14" fill="#52514e" text-anchor="start" font-weight="400" >Learning = nudging the weights after every wrong answer. Nothing else in the machine changes.</text>
</svg>
